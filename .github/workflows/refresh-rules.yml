name: Refresh managed Shadowrocket rules

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-rules.yml'
      - 'scripts/update-review-pr.ps1'
      - 'scripts/test-update-review-pr.ps1'
      - 'scripts/update-rules.ps1'
      - 'scripts/validate-config.ps1'
  schedule:
    # Monday 11:23 Asia/Shanghai. A non-round minute reduces scheduler delays.
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: shadowrocket-managed-rule-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate review publication handling
        shell: pwsh
        run: ./scripts/test-update-review-pr.ps1

      - name: Refresh upstream snapshots
        shell: pwsh
        run: ./scripts/update-rules.ps1

      - name: Validate refreshed configuration and rules
        shell: pwsh
        run: ./scripts/validate-config.ps1

      - name: Detect reviewed file scope
        id: changes
        shell: pwsh
        run: |
          $changedFiles = @(git diff --name-only)
          $unexpectedFiles = @($changedFiles | Where-Object { $_ -notlike 'rules/*' })
          if ($unexpectedFiles.Count -gt 0) {
            throw "Rule refresh changed files outside rules/: $($unexpectedFiles -join ', ')"
          }

          $hasChanges = $changedFiles.Count -gt 0
          "changed=$($hasChanges.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "### Managed rule refresh" >> $env:GITHUB_STEP_SUMMARY
          if ($hasChanges) {
            "Validated changes: $($changedFiles.Count) file(s)." >> $env:GITHUB_STEP_SUMMARY
            $changedFiles | ForEach-Object { "- ``$_``" >> $env:GITHUB_STEP_SUMMARY }
          }
          else {
            "No upstream changes detected." >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Publish validated review branch
        if: steps.changes.outputs.changed == 'true'
        shell: pwsh
        run: |
          $branch = 'automation/managed-rules'
          git config user.name 'github-actions[bot]'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot set commit author.' }
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot set commit email.' }
          git switch -C $branch
          if ($LASTEXITCODE -ne 0) { throw 'Cannot prepare the review branch.' }
          git add -- rules
          if ($LASTEXITCODE -ne 0) { throw 'Cannot stage refreshed rules.' }
          git commit -m 'Refresh managed Shadowrocket rules'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot commit refreshed rules.' }
          git push --force-with-lease origin "HEAD:refs/heads/$branch"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot publish the review branch.' }

      - name: Update the managed review pull request
        if: steps.changes.outputs.changed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/update-review-pr.ps1
